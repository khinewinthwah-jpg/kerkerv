<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plex Auto Login</title>
</head>
<body style="background-color: #1f2326; color: #e5a00d; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Plex အကောင့်သို့ ချိတ်ဆက်နေပါသည်...</h2>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            // Storage အမျိုးစုံထဲသို့ Token ထည့်ခြင်း
            localStorage.setItem('plexToken', token);
            localStorage.setItem('myPlexAccessToken', token);
            localStorage.setItem('authToken', token);
            
            // watch.plex.tv ဆီသို့ Token နဲ့တကွ တိုက်ရိုက်ပို့ခြင်း
            window.location.replace('https://watch.plex.tv/?X-Plex-Token=' + token);
        } else {
            document.body.innerHTML = "<h2>Token မမှန်ကန်ပါ။</h2>";
        }
    </script>
</body>
</html>
